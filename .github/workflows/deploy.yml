name: Deploy to Cloudflare Pages

# Builds the Astro/Svelte marketing site and ships it to the Cloudflare Pages
# project named in website/wrangler.toml ("clipwell").
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare dashboard → My Profile → API Tokens →
#     Create Token → Edit Cloudflare Pages template. Must be scoped to the
#     account that owns the "clipwell" Pages project.
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard → Workers & Pages →
#     right sidebar → "Account ID".
# Configure at: https://github.com/lioneltchami/clipwell/settings/secrets/actions
#
# Triggers:
#   push to main   → auto-deploy on any website/** change
#   workflow_dispatch → manual run from the Actions tab
#
# Why this workflow (and not GitHub Pages or Netlify):
#   - GitHub Pages returned 404 Not Found on every push because the Pages
#     project on this repo was never enabled.
#   - Netlify is a parallel config (see website/netlify.toml) but is not the
#     production target. The live site is hosted on Cloudflare Pages at
#     https://clipwell-site-1cn.pages.dev — this workflow ships there.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: "20"
      PNPM_VERSION: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: website
        run: pnpm build

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Configure at:"
            echo "::error::  https://github.com/lioneltchami/clipwell/settings/secrets/actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Configure at:"
            echo "::error::  https://github.com/lioneltchami/clipwell/settings/secrets/actions"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Shipping website/dist to Cloudflare Pages project 'clipwell'."
          pnpm dlx wrangler@4 pages deploy dist \
            --project-name=clipwell \
            --branch=main \
            --commit-dirty=true
